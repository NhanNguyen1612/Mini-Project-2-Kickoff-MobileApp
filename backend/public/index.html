  <style>
    :root {
      --primary: #1E3A5F;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --danger: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0F172A; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    
    /* Device frame wrapper for true mobile experience */
    .app-frame {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 920px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    @media (min-width: 640px) {
      .app-frame {
        border-radius: 36px;
        height: 90vh;
        border: 8px solid #1E293B;
      }
    }
    
    /* Dynamic Island / Status bar */
    .status-bar {
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 700;
      color: #1E293B;
      z-index: 10;
    }
    
    /* App Header */
    .app-header {
      padding: 12px 18px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-title-group h1 { font-size: 18px; font-weight: 800; color: var(--primary); }
    .app-title-group p { font-size: 12px; color: var(--text-muted); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ECFDF5;
      color: #059669;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #10B981; }

    /* Main Scrollable Screen */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 80px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Search Bar */
    .search-box {
      display: flex;
      align-items: center;
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      margin-left: 8px;
      font-size: 14px;
      color: var(--text);
    }

    /* Horizontal Filter Chips */
    .chips-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap;
      padding: 6px 14px;
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Room Cards Grid */
    .rooms-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .room-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;

    .room-card:active { transform: scale(0.98); }
    .room-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #E2E8F0;
    }
    .room-body { padding: 14px; }
    .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .room-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .capacity-badge {

      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;

    .amenity-tag {
      background: #F8FAFC;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #475569;
    }
    .room-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #F1F5F9;
    }
    .status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .status-available { background: #ECFDF5; color: #059669; }
    .status-occupied { background: #FEF2F2; color: #DC2626; }
    .btn-book-quick {
      background: var(--accent);
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* Modal Sheet for Room Detail & Booking */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .modal-sheet {
      background: white;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-close-bar { width: 40px; height: 5px; background: #CBD5E1; border-radius: 3px; align-self: center; margin-bottom: 16px; }
    
    /* Time Slot Grid (Conflict Prevention) */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 14px 0;
    }
    .slot-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #F8FAFC;
      cursor: pointer;
      transition: all 0.2s;
    }
    .slot-card.selected {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .slot-card.booked {
      opacity: 0.5;
      background: #F1F5F9;
      cursor: not-allowed;
      border-color: var(--border);
    }
    .slot-card.booked .slot-time { text-decoration: line-through; color: #94A3B8; }
    .slot-time { font-size: 13px; font-weight: 700; color: var(--text); }
    .slot-status-text { font-size: 11px; margin-top: 4px; font-weight: 600; color: #059669; }
    .slot-card.booked .slot-status-text { color: #DC2626; }
    .slot-card.selected .slot-status-text { color: var(--accent); }

    /* Bottom Tab Navigation Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      border: none;
      background: none;
      flex: 1;
    }
    .nav-tab.active { color: var(--accent); }
    .nav-tab i { font-size: 18px; }

    /* Booking Card in My Bookings */
    .booking-card {

      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);

    .booking-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .btn-cancel {

      color: #B91C1C;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>

    const BUILDINGS = ['Tất cả', 'Tòa nhà A3', 'Tòa nhà A1', 'Tòa nhà A2', 'Thư viện Trung tâm', 'Tòa nhà V', 'Khu Thực nghiệm K'];

    function App() {
      const [currentTab, setCurrentTab] = useState('browse'); // browse | bookings | profile
      const [rooms, setRooms] = useState(FALLBACK_ROOMS);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBuilding, setSelectedBuilding] = useState('Tất cả');
      const [selectedRoom, setSelectedRoom] = useState(null); // For booking modal
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [purpose, setPurpose] = useState('');
      const [bookings, setBookings] = useState([
        { id: 'b-init-1', room_id: 'r-101', room_name: 'Lab A3-101 (Software Eng)', building: 'Tòa nhà A3', time_slot: '07:30 - 09:30', booking_date: new Date().toISOString().split('T')[0], status: 'confirmed', purpose: 'Học nhóm Mobile App React Native' }
      ]);
      const [user, setUser] = useState({
        studentId: '22IT001',
        fullName: 'Nguyễn Văn An',
        email: 'annv.22it@vku.udn.vn',
        dept: 'Khoa Công nghệ Thông tin'
      });

      // Fetch from Cloudflare API if live
      useEffect(() => {
        fetch('/api/rooms')
          .then(res => res.json())
          .then(res => { if (res.data && res.data.length > 0) setRooms(res.data); })
          .catch(() => console.log('Using local fallback'));
        
        fetch('/api/bookings')
          .then(res => res.json())
          .then(res => { if (res.data && res.data.length > 0) setBookings(res.data); })
          .catch(() => {});
      }, []);

      // Filter logic
      const filteredRooms = rooms.filter(r => {
        const matchesSearch = !searchQuery || r.name.toLowerCase().includes(searchQuery.toLowerCase()) || r.building.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesBuilding = selectedBuilding === 'Tất cả' || r.building === selectedBuilding;
        return matchesSearch && matchesBuilding;
      });

      // Conflict prevention: slots booked for selected room on selected date
      const bookedSlots = bookings
        .filter(b => selectedRoom && b.room_id === selectedRoom.id && b.booking_date === selectedDate && b.status === 'confirmed')
        .map(b => b.time_slot);

      const handleConfirmBooking = async () => {
        if (!selectedSlot) return alert('Vui lòng chọn ca học!');
        if (bookedSlots.includes(selectedSlot)) return alert('Ca học này đã bị trùng lịch!');

        const newBooking = {
          id: 'b-' + Date.now(),
          room_id: selectedRoom.id,
          room_name: selectedRoom.name,
          building: selectedRoom.building,
          user_name: user.fullName,
          user_student_id: user.studentId,
          booking_date: selectedDate,
          time_slot: selectedSlot,
          purpose: purpose || 'Học tập & Nghiên cứu',
          status: 'confirmed'
        };

        // Call online API
        try {
          await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newBooking)
          });
        } catch (e) {}

        setBookings([newBooking, ...bookings]);
        alert(`🎉 Đặt phòng thành công phòng ${selectedRoom.name} vào ca ${selectedSlot}!`);
        setSelectedRoom(null);
        setSelectedSlot(null);
        setCurrentTab('bookings');
      };

      const handleCancelBooking = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn hủy ca đặt phòng này?')) return;
        try {
          await fetch('/api/bookings/' + id, { method: 'DELETE' });
        } catch (e) {}
        setBookings(bookings.map(b => b.id === id ? { ...b, status: 'cancelled' } : b));
      };

      return (
        <div className="app-frame">
          {/* Header */}
          <div className="app-header">
            <div className="app-title-group">
              <h1>VKU Room Booking</h1>
              <p>Hệ Thống Đặt Phòng Học & Lab</p>
            </div>
            <div className="status-pill">
              <span className="dot"></span>
              <span>Cloudflare Online</span>
            </div>
          </div>

          {/* Screens */}
          {currentTab === 'browse' && (
            <div className="screen-content">
              {/* Search */}
              <div className="search-box">
                <i className="fa-solid fa-magnifying-glass" style={{ color: '#94A3B8' }}></i>
                <input
                  type="text"
                  placeholder="Tìm phòng học, lab A3, thư viện..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
                {searchQuery && (
                  <i className="fa-solid fa-xmark" style={{ cursor: 'pointer', color: '#94A3B8' }} onClick={() => setSearchQuery('')}></i>
                )}
              </div>

              {/* Filter Chips */}
              <div className="chips-container">
                {BUILDINGS.map(b => (
                  <div
                    key={b}
                    className={`chip ${selectedBuilding === b ? 'active' : ''}`}
                    onClick={() => setSelectedBuilding(b)}
                  >
                    {b}
                  </div>
                ))}
              </div>

              {/* Feed of RoomCards (60fps FlatList equivalent) */}
              <div className="rooms-grid">
                {filteredRooms.map(room => (
                  <div key={room.id} className="room-card" onClick={() => setSelectedRoom(room)}>
                    <img src={room.image_url} alt={room.name} className="room-image" />
                    <div className="room-body">
                      <div className="room-header">
                        <div className="room-name">{room.name}</div>
                        <div className="capacity-badge">{room.capacity} chỗ</div>
                      </div>
                      <div className="room-building">
                        <i className="fa-solid fa-location-dot" style={{ color: '#EF4444' }}></i>
                        {room.building}
                      </div>
                      <div className="amenities-preview">
                        {room.amenities.slice(0, 3).map((a, i) => (
                          <span key={i} className="amenity-tag">✨ {a}</span>
                        ))}
                      </div>
                      <div className="room-footer">
                        <span className="status-badge status-available">● Đang mở đặt</span>
                        <button className="btn-book-quick" onClick={(e) => { e.stopPropagation(); setSelectedRoom(room); }}>
                          Đặt phòng
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {currentTab === 'bookings' && (
            <div className="screen-content">
              <h2 style={{ fontSize: '18px', fontWeight: 800, marginBottom: '14px', color: '#0F172A' }}>Lịch Đặt Của Tôi</h2>
              {bookings.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '60px 20px', color: '#64748B' }}>
                  <i className="fa-regular fa-calendar-xmark" style={{ fontSize: '48px', marginBottom: '12px' }}></i>
                  <p>Bạn chưa đặt phòng học nào.</p>
                </div>
              ) : (
                bookings.map(b => {
                  const isCancelled = b.status === 'cancelled';
                  return (
                    <div key={b.id} className="booking-card">
                      <div className="booking-card-header">
                        <span style={{ fontWeight: 700, fontSize: '15px' }}>{b.room_name}</span>
                        <span className={`status-badge ${isCancelled ? 'status-occupied' : 'status-available'}`}>
                          {isCancelled ? 'Đã hủy' : 'Đã xác nhận'}
                        </span>
                      </div>
                      <p style={{ fontSize: '13px', color: '#64748B', marginBottom: '8px' }}>📍 {b.building}</p>
                      <div style={{ fontSize: '13px', display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                        <span><b>Ngày:</b> {b.booking_date}</span>
                        <span><b>Ca:</b> {b.time_slot}</span>
                      </div>
                      <div style={{ fontSize: '12px', color: '#475569', marginBottom: '10px' }}>
                        <b>Mục đích:</b> {b.purpose}
                      </div>
                      {!isCancelled && (
                        <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                          <button className="btn-cancel" onClick={() => handleCancelBooking(b.id)}>Hủy đặt phòng</button>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          )}

          {currentTab === 'profile' && (
            <div className="screen-content">
              <div style={{ textAlign: 'center', padding: '20px', background: 'white', borderRadius: '16px', border: '1px solid #E2E8F0', marginBottom: '16px' }}>
                <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: '#1E3A5F', color: 'white', fontSize: '24px', fontWeight: 800, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: '10px' }}>
                  {user.fullName[0]}
                </div>
                <h2 style={{ fontSize: '18px', fontWeight: 800 }}>{user.fullName}</h2>
                <p style={{ fontSize: '13px', color: '#2563EB', fontWeight: 600 }}>MSSV: {user.studentId}</p>
                <p style={{ fontSize: '12px', color: '#64748B' }}>{user.dept}</p>
              </div>

              <div style={{ background: 'white', borderRadius: '16px', padding: '16px', border: '1px solid #E2E8F0' }}>
                <h3 style={{ fontSize: '14px', fontWeight: 700, marginBottom: '12px', color: '#1E3A5F' }}>Hạ Tầng Cloudflare Edge</h3>
                <p style={{ fontSize: '12px', color: '#64748B', lineHeight: '1.6', marginBottom: '12px' }}>
                  Ứng dụng đang chạy hoàn toàn trực tuyến trên mạng lưới toàn cầu của Cloudflare. Mọi dữ liệu đặt phòng và chống trùng lịch được xử lý tức thời trên Cloudflare D1.
                </p>
                <div style={{ padding: '10px', background: '#F8FAFC', borderRadius: '8px', fontSize: '12px', border: '1px solid #E2E8F0' }}>
                  <div><b>Nền tảng:</b> Cloudflare Pages</div>
                  <div><b>Cơ sở dữ liệu:</b> Cloudflare D1 (SQLite Edge)</div>
                  <div><b>Trạng thái:</b> 100% Hoạt động</div>
                </div>
              </div>
            </div>
          )}

          {/* Modal for Booking (Conflict Prevention) */}
          {selectedRoom && (
            <div className="modal-overlay" onClick={() => setSelectedRoom(null)}>
              <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
                <div className="modal-close-bar"></div>
                <h2 style={{ fontSize: '18px', fontWeight: 800, color: '#0F172A' }}>{selectedRoom.name}</h2>
                <p style={{ fontSize: '13px', color: '#64748B', marginTop: '2px' }}>📍 {selectedRoom.building} • {selectedRoom.capacity} chỗ ngồi</p>
                
                <h3 style={{ fontSize: '14px', fontWeight: 700, marginTop: '16px', color: '#1E293B' }}>Chọn ca học:</h3>
                <p style={{ fontSize: '11px', color: '#64748B' }}>* Ca bị gạch ngang đã có người đặt trước (Chống trùng lịch)</p>

                <div className="slot-grid">
                  {SLOTS.map(slot => {
                    const isBooked = bookedSlots.includes(slot);
                    const isSelected = selectedSlot === slot;
                    return (
                      <div
                        key={slot}
                        className={`slot-card ${isBooked ? 'booked' : ''} ${isSelected ? 'selected' : ''}`}
                        onClick={() => !isBooked && setSelectedSlot(slot)}
                      >
                        <div className="slot-time">{slot}</div>
                        <div className="slot-status-text">
                          {isBooked ? '🚫 Đã có người đặt' : isSelected ? '✓ Đang chọn' : 'Còn trống'}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div style={{ marginTop: '10px' }}>
                  <label style={{ fontSize: '13px', fontWeight: 600, color: '#334155' }}>Mục đích sử dụng:</label>
                  <input
                    type="text"
                    style={{ width: '100%', padding: '10px', borderRadius: '8px', border: '1px solid #CBD5E1', marginTop: '6px', outline: 'none' }}
                    placeholder="VD: Ôn tập nhóm đồ án Mobile App..."
                    value={purpose}
                    onChange={(e) => setPurpose(e.target.value)}
                  />
                </div>

                <button
                  style={{
                    marginTop: '20px',
                    padding: '14px',
                    borderRadius: '12px',
                    background: selectedSlot ? '#2563EB' : '#94A3B8',
                    color: 'white',
                    fontWeight: 700,
                    border: 'none',
                    cursor: selectedSlot ? 'pointer' : 'not-allowed',
                    fontSize: '15px'
                  }}
                  disabled={!selectedSlot}
                  onClick={handleConfirmBooking}
                >
                  {selectedSlot ? `Xác nhận đặt ca ${selectedSlot}` : 'Vui lòng chọn ca học'}
                </button>
              </div>
            </div>
          )}

          {/* Bottom Tabs */}
          <div className="bottom-nav">
            <button className={`nav-tab ${currentTab === 'browse' ? 'active' : ''}`} onClick={() => setCurrentTab('browse')}>
              <i className="fa-solid fa-building"></i>
              <span>Browse Rooms</span>
            </button>
            <button className={`nav-tab ${currentTab === 'bookings' ? 'active' : ''}`} onClick={() => setCurrentTab('bookings')}>
              <i className="fa-regular fa-calendar-check"></i>
              <span>My Bookings</span>
            </button>
            <button className={`nav-tab ${currentTab === 'profile' ? 'active' : ''}`} onClick={() => setCurrentTab('profile')}>
              <i className="fa-regular fa-user"></i>
              <span>Profile</span>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
